<style>

  .notice-link {

<script>
  let allSongs = [];
  let songById = {};
  let allLives = [];
  let liveByName = {};
  let discByName = {};
  let allYoutube = [];
  const SITE_TITLE = 'SixTONES楽曲データベース';

  const MEMBER_STYLE = {
    'ジェシー':   { bg: '#e2434f', text: '#ffffff' },
    '京本大我':   { bg: '#ec6fa0', text: '#ffffff' },
    '松村北斗':   { bg: '#000000', text: '#ffffff' },
    '髙地優吾':   { bg: '#f0c14b', text: '#1b1b1e' },
    '森本慎太郎': { bg: '#5fa873', text: '#ffffff' },
    '田中樹':     { bg: '#4f8fd1', text: '#ffffff' }
  };

  const ROLE_LABELS = {
    music: 'Music',
    lyrics: 'Lyrics',
    arrangement: 'Arrangement',
    other: 'Other',
    musicianChorus: 'Musician / Chorus',
    mix: 'Mix',
    mastering: 'Mastering',
    movieDirector: 'Movie Director',
    choreographer: 'Choreographer'
  };

  const YT_LIST_TAGS = ['Music Video', 'Performance', 'CD digeST'];

  const YOUTUBE_CATEGORIES = [
    { id: 'mv', label: 'MV', tag: 'Music Video' },
    { id: 'performance', label: 'Performance', tag: 'Performance' },
    { id: 'cd-digest', label: 'CD digeST', tag: 'CD digeST' },
    { id: 'bddvd-digest', label: 'BD / DVD digeST', tag: 'BD/DVD digeST' },
    { id: 'making', label: 'Making / Behind Scene', tag: 'Making/Behind Scene' },
    { id: 'yt-other', label: 'Other', tag: 'Other' }
  ];

  const MEMBER_ORDER = ['ジェシー', '京本大我', '松村北斗', '髙地優吾', '森本慎太郎', '田中樹'];

  const TABS = [
    { id: 'original', label: 'Original' },
    { id: 'unit-solo', label: 'Unit / Solo' },
    { id: 'rearrange', label: 'Rearrange' },
    { id: 'other', label: 'Other' },
    { id: 'cover', label: 'Cover' },
    { id: 'streaming', label: 'ストリーミング' },
    { id: 'no-streaming', label: 'ストリーミング未配信' },
    { id: 'all', label: 'All' }
  ];

  const CREDIT_GROUPS = {
    'song-writer':     { title: 'Music / Lyrics / Arrangement', roles: ['music', 'lyrics', 'arrangement'] },
    'movie-director':  { title: 'Movie Director', roles: ['movieDirector'] },
    'choreographer':   { title: 'Choreographer', roles: ['choreographer'] },
    'musician-chorus': { title: 'Musician / Chorus', roles: ['musicianChorus'] }
  };

  function isOriginalTag(tag) {
    return tag.indexOf('Rearrange') === -1 && tag.indexOf('Other') === -1 && tag.indexOf('Cover') === -1;
  }

  function matchesTab(song, tabId) {
    const tag = song.tag || [];
    if (tabId === 'original') return isOriginalTag(tag);
    if (tabId === 'unit-solo') return (song.solo && song.solo.length) || (song.unit && song.unit.length);
    if (tabId === 'rearrange') return tag.indexOf('Rearrange') !== -1;
    if (tabId === 'other') return tag.indexOf('Other') !== -1;
    if (tabId === 'cover') return tag.indexOf('Cover') !== -1;
    if (tabId === 'streaming') {
      return (isOriginalTag(tag) || tag.indexOf('Rearrange') !== -1) && tag.indexOf('ストリーミング') !== -1;
    }
    if (tabId === 'no-streaming') {
      return (isOriginalTag(tag) || tag.indexOf('Rearrange') !== -1) && tag.indexOf('ストリーミング') === -1;
    }
    return true; // all
  }

  function matchesMember(song, member) {
    if (!member || member === 'all') return true;
    return (song.solo && song.solo.indexOf(member) !== -1) || (song.unit && song.unit.indexOf(member) !== -1);
  }

  // ---------- helpers ----------

  function enc(s) { return encodeURIComponent(s); }
  function dec(s) { return decodeURIComponent(s); }

  function backLink() {
    return '<div class="nav-links">' +
      '<a class="back-link" href="javascript:void(0)" onclick="history.back()">← 戻る</a>' +
      '<a class="back-link" href="#/">TOPへ</a>' +
    '</div>';
  }

  // ソート/タブの切り替えは履歴を汚さないよう replaceState で行う（戻るボタンで一段飛ばしにしない）
  function updateQuery(hash) {
    history.replaceState(null, '', '#' + hash);
    route();
  }

  function songLink(song) { return '#/song/' + enc(song.id || song.title); }
  function songKeyOf(song) { return song.id || song.title; }

  function memberBadge(name) {
    const s = MEMBER_STYLE[name] || { bg: '#555', text: '#fff' };
    return '<a class="member-badge" href="#/member/' + enc(name) + '" style="background:' + s.bg + ';color:' + s.text + '">' + name + '</a>';
  }

  function personLink(name) {
    return '<a href="#/person/' + enc(name) + '">' + name + '</a>';
  }

  function entityLinks(arr, routePrefix) {
    if (!arr || !arr.length) return null;
    return arr.map(function (name) {
      return '<a href="#/' + routePrefix + '/' + enc(name) + '">' + name + '</a>';
    }).join('・');
  }

  function joinLinks(names, linkFn) {
    if (!names || !names.length) return null;
    return names.map(linkFn).join('・');
  }

  function joinPlain(names) {
    return (names && names.length) ? names.join('・') : null;
  }

  function soloUnitLine(song) {
    if (song.solo && song.solo.length) return 'Solo：' + song.solo.map(memberBadge).join('');
    if (song.unit && song.unit.length) return 'Unit：' + song.unit.map(memberBadge).join('');
    return null;
  }

  function ytTagButtons(song) {
    if (!song.youtube || !song.youtube.length) return [];
    return YT_LIST_TAGS.map(function (tag) {
      const match = song.youtube.find(function (y) { return y.tag && y.tag.indexOf(tag) !== -1; });
      return match ? '<a class="youtube" href="' + match.url + '" target="_blank" rel="noopener">▶︎ ' + tag + '</a>' : null;
    }).filter(Boolean);
  }

  function extractYoutubeId(url) {
    if (!url) return null;
    const patterns = [
      /[?&]v=([^&]+)/,
      /youtu\.be\/([^?&]+)/,
      /youtube\.com\/embed\/([^?&]+)/,
      /youtube\.com\/shorts\/([^?&]+)/,
      /youtube\.com\/live\/([^?&]+)/
    ];
    for (let i = 0; i < patterns.length; i++) {
      const m = url.match(patterns[i]);
      if (m) return m[1];
    }
    return null;
  }

  function renderYoutubeEmbeds(youtubeArr) {
    return (youtubeArr || []).map(function (y) {
      const videoId = extractYoutubeId(y.url);
      const head = '<div class="yt-embed-head"><span class="yt-embed-title">' + (y.title || 'YouTube') + '</span>' +
        '<span class="yt-tag">' + (y.tag || []).join('・') + '</span></div>';
      if (videoId) {
        return '<div class="yt-embed">' + head +
          '<div class="yt-embed-frame"><iframe src="https://www.youtube.com/embed/' + videoId + '" title="' + (y.title || 'YouTube') + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' +
        '</div>';
      }
      // 動画IDが取れなかった場合はリンクだけにフォールバック
      return '<div class="yt-embed">' + head + '<a href="' + y.url + '" target="_blank" rel="noopener">▶︎ 動画を開く</a></div>';
    }).join('');
  }

  function shareButton(title) {
    const text = enc(title + ' | ' + SITE_TITLE);
    const url = enc(location.href);
    return '<a class="share" href="https://twitter.com/intent/tweet?text=' + text + '&url=' + url + '&hashtags=SixTONESmusicdb" target="_blank" rel="noopener">Share on X</a>';
  }

  function tieupNames(song) {
    if (!song.tieup || !song.tieup.length) return null;
    const names = song.tieup.map(function (t) { return t.name; }).filter(Boolean);
    return names.length ? names.join('・') : null;
  }

  // ---------- rendering: list entry (shared by list / person / member / disc / tag / live pages) ----------

  function renderListEntry(song, opts) {
    opts = opts || {};
    const discHtml = opts.hideDisc ? null : entityLinks(song.disc, 'disc');
    const metaLine = [song.release, discHtml ? '収録：' + discHtml : null].filter(Boolean).join(' ・ ');
    const tieupLine = tieupNames(song);
    const badgeLine = soloUnitLine(song);
    const isJunior = song.tag && song.tag.indexOf('ジュニア') !== -1;

    const creditRows = [];
    const musicLinks = joinLinks(song.music, personLink);
    const lyricsLinks = joinLinks(song.lyrics, personLink);
    if (musicLinks) creditRows.push('<b>' + ROLE_LABELS.music + '</b>' + musicLinks);
    if (lyricsLinks) creditRows.push('<b>' + ROLE_LABELS.lyrics + '</b>' + lyricsLinks);

    const streamLinks = [];
    if (song.spotify) streamLinks.push('<a class="spotify" href="' + song.spotify + '" target="_blank" rel="noopener">▶︎ Spotify</a>');
    if (song.apple) streamLinks.push('<a class="apple" href="' + song.apple + '" target="_blank" rel="noopener">▶︎ Apple Music</a>');

    const ytButtons = ytTagButtons(song);

    return '' +
      '<div class="entry">' +
        '<div class="title-row">' +
          '<span class="title-group"><a class="title-link" href="' + songLink(song) + '">' + song.title + '</a>' +
          (isJunior ? '<span class="junior-badge">ジュニア</span>' : '') + '</span>' +
          (streamLinks.length ? '<div class="stream-links">' + streamLinks.join('') + '</div>' : '') +
        '</div>' +
        (badgeLine ? '<div class="badge-row">' + badgeLine + '</div>' : '') +
        (metaLine ? '<div class="meta">' + metaLine + '</div>' : '') +
        (tieupLine ? '<div class="meta tieup">' + tieupLine + '</div>' : '') +
        (creditRows.length ? '<div class="credits">' + creditRows.join(' / ') + '</div>' : '') +
        (ytButtons.length ? '<div class="links">' + ytButtons.join('') + '</div>' : '') +
      '</div>';
  }

  function songHasVideoTag(song, tag) {
    return (song.youtube || []).some(function (y) { return y.tag && y.tag.indexOf(tag) !== -1; });
  }

  // ---------- rendering: list ----------

  function renderList(params) {
    const sort = params.get('sort') || 'desc';
    const tab = params.get('tab') || 'original';
    const member = tab === 'unit-solo' ? (params.get('member') || 'all') : 'all';

    const sorted = allSongs.slice().sort(function (a, b) {
      const diff = (a.no || 0) - (b.no || 0);
      return sort === 'asc' ? diff : -diff;
    });
    const tabbed = sorted.filter(function (s) { return matchesTab(s, tab) && matchesMember(s, member); });

    const memberSubtabsHtml = tab === 'unit-solo'
      ? '<div class="tabs member-subtabs">' +
          '<button class="member-tab-btn' + (member === 'all' ? ' active' : '') + '" data-member="all" style="' +
            (member === 'all' ? 'background:var(--accent);color:#1b1b1e;border-color:var(--accent);' : 'border-color:var(--border);color:var(--text-muted);') +
          '">All</button>' +
          MEMBER_ORDER.map(function (name) {
            const style = MEMBER_STYLE[name];
            const active = member === name;
            return '<button class="member-tab-btn' + (active ? ' active' : '') + '" data-member="' + name + '" style="background:' + style.bg + ';color:' + style.text + ';border-color:' + style.bg + ';' + (active ? '' : 'opacity:0.55;') + '">' + name + '</button>';
          }).join('') +

    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        '<p class="kicker">SixTONES / DISCOGRAPHY ARCHIVE</p>' +
        '<div class="title-row"><h1>' + SITE_TITLE + '</h1><div class="stream-links">' + shareButton(SITE_TITLE) + '</div></div>' +
        '<p class="desc">SixTONES楽曲に携わる作家・演奏家・MV監督・コレオグラファー・公式YouTube等の情報を集約したファンサイト</p>' +
        '<p class="desc">SixTONES：6人組男性アイドルグループ。2015年5月1日結成、2020年1月22日｢<a href="#/disc/' + enc('Imitation Rain') + '">Imitation Rain</a>｣でデビュー。メンバーはジェシー・京本大我・松村北斗・髙地優吾・森本慎太郎・田中樹。</p>' +
        '<a class="notice-link" href="#/notice">⚠️ 注意事項</a>' +
        '<p class="nav-label nav-label-index">INDEX</p>' +
        '<nav class="site-nav nav-index">' +
          '<a href="#/discs">Disc</a>' +
          '<a href="#/lives">Live</a>' +
        '</nav>' +
        '<p class="nav-label nav-label-credit">CREDIT</p>' +
        '<nav class="site-nav nav-credit">' +
          '<a href="#/credits/song-writer">Music / Lyrics / Arrangement</a>' +
          '<a href="#/credits/movie-director">Movie Director</a>' +
          '<a href="#/credits/choreographer">Choreographer</a>' +
          '<a href="#/credits/musician-chorus">Musician / Chorus</a>' +
        '</nav>' +
        '<p class="nav-label nav-label-youtube">YouTube</p>' +
        '<nav class="site-nav nav-youtube">' +
          YOUTUBE_CATEGORIES.map(function (c) { return '<a href="#/youtube/' + c.id + '">' + c.label + '</a>'; }).join('') +
        '</nav>' +
        '<p class="nav-label">SONGS</p>' +
        '<div class="tabs">' + TABS.map(function (t) {
          return '<button class="tab-btn' + (t.id === tab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
        }).join('') + '</div>' +
        memberSubtabsHtml +
        '<div class="search-sort-row">' +
          '<div class="search-box"><span class="search-icon">🔍</span><input type="text" id="search" placeholder="曲名・作家名で検索…" autocomplete="off"></div>' +
          '<button class="sort-btn" id="sort-toggle">' + (sort === 'asc' ? '古い順' : '新しい順') + ' ▾</button>' +
        '</div>' +
        '<div class="video-filter-row">' +
          '<label><input type="checkbox" id="filter-performance"> Performance動画のある曲に絞る</label>' +
          '<label><input type="checkbox" id="filter-mv"> Music Videoのある曲に絞る</label>' +
        '</div>' +
      '</header>' +
      '<p class="count" id="count"></p>' +
      '<main id="list"></main>';

    document.getElementById('sort-toggle').addEventListener('click', function () {
      const memberQuery = tab === 'unit-solo' ? '&member=' + enc(member) : '';
      updateQuery('/?tab=' + tab + memberQuery + '&sort=' + (sort === 'asc' ? 'desc' : 'asc'));
    });

    page.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        updateQuery('/?tab=' + btn.getAttribute('data-tab') + '&sort=' + sort);
      });
    });

    page.querySelectorAll('.member-tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        updateQuery('/?tab=unit-solo&member=' + enc(btn.getAttribute('data-member')) + '&sort=' + sort);
      });
    });

    function draw(songs) {
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      if (!songs.length) {
        list.innerHTML = '<div class="empty">該当する曲が見つかりません<span class="mono">別のキーワードで試してみてください</span></div>';
        count.textContent = '';
        return;
      }
      count.textContent = songs.length + '曲';
      list.innerHTML = songs.map(function (s) { return renderListEntry(s); }).join('');
    }

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const wantPerformance = document.getElementById('filter-performance').checked;
      const wantMV = document.getElementById('filter-mv').checked;

      let result = tabbed;

      if (wantPerformance) {
        result = result.filter(function (song) { return songHasVideoTag(song, 'Performance'); });
      }
      if (wantMV) {
        result = result.filter(function (song) { return songHasVideoTag(song, 'Music Video'); });
      }
      if (q) {
        result = result.filter(function (song) {
          const hay = [
            song.title,
            joinPlain(song.music),
            joinPlain(song.lyrics),
            joinPlain(song.arrangement),
            joinPlain(song.disc)
          ].filter(Boolean).join(' ').toLowerCase();
          return hay.indexOf(q) !== -1;
        });
      }

      draw(result);
    }

    draw(tabbed);

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-performance').addEventListener('change', applyFilters);
    document.getElementById('filter-mv').addEventListener('change', applyFilters);
  }

  // ---------- rendering: simple filtered list (tag / live) ----------

  function renderSimpleList(title, songs) {
    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<div class="title-row"><h1>' + title + '</h1><div class="stream-links">' + shareButton(title) + '</div></div>' +
        '<p class="desc">' + songs.length + '曲</p>' +
      '</header>' +
      '<main>' + (songs.length ? songs.map(function (s) { return renderListEntry(s); }).join('') : '<div class="empty">曲が見つかりません</div>') + '</main>';
  }

  function renderTag(name) {
    renderSimpleList('Tag: ' + name, allSongs.filter(function (s) { return s.tag && s.tag.indexOf(name) !== -1; }));
  }

  function formatPeriod(live) {
    if (!live || !live.periodStart) return null;
    return (live.periodEnd && live.periodEnd !== live.periodStart)
      ? live.periodStart + ' 〜 ' + live.periodEnd
      : live.periodStart;
  }

  function renderLive(name) {
    const page = document.getElementById('page');
    const live = liveByName[name];
    const songs = allSongs
      .filter(function (s) { return s.live && s.live.indexOf(name) !== -1; })
      .sort(function (a, b) { return (a.no || 0) - (b.no || 0); });

    const metaBits = [];
    if (live) {
      const period = formatPeriod(live);
      if (period) metaBits.push(period);
      if (live.category) metaBits.push(live.category);
    }

    const musiciansHtml = live && live.musicians && live.musicians.length ? live.musicians.join('・') : null;
    const noteHtml = live && live.note ? live.note : null;
    const bodyHtml = live && live.bodyText
      ? '<div class="detail-section"><div class="detail-value" style="white-space:pre-line">' + live.bodyText + '</div></div>'
      : '';
    const ytList = renderYoutubeEmbeds(live && live.youtube);

    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<div class="title-row"><h1>' + name + '</h1><div class="stream-links">' + shareButton(name) + '</div></div>' +
        (metaBits.length ? '<p class="desc">' + metaBits.join(' ・ ') + '</p>' : '') +
        (musiciansHtml ? '<p class="desc">Musician：' + musiciansHtml + '</p>' : '') +
      '</header>' +
      '<main>' +
        (noteHtml ? detailRow('備考', noteHtml) : '') +
        bodyHtml +
        (ytList ? '<div class="detail-section"><p class="detail-label">YouTube</p>' + ytList + '</div>' : '') +
        '<div class="role-group">' +
          '<p class="role-title">披露楽曲</p>' +
          '<p class="live-note">※実際のセトリ順ではありません。</p>' +
          '<p class="live-note">※Blu-ray / DVDの収録内容は公式ホームページを確認してください。</p>' +
          (songs.length ? songs.map(function (s) { return renderListEntry(s); }).join('') : '<div class="empty">曲が見つかりません</div>') +
        '</div>' +
      '</main>';
  }

  // ---------- rendering: disc page (grouped by disc type) ----------

  function discTypePriority(type) {
    if (type.indexOf('形態共通') !== -1) return 0;
    if (type.indexOf('初回') !== -1) return 1;
    if (type.indexOf('通常盤') !== -1) return 2;
    return 3;
  }

  function renderDisc(name) {
    const page = document.getElementById('page');
    const songs = allSongs
      .filter(function (s) { return s.disc && s.disc.indexOf(name) !== -1; })
      .sort(function (a, b) { return (a.no || 0) - (b.no || 0); });

    const groups = {};
    const order = [];
    const noType = [];

    songs.forEach(function (song) {
      const ownTypes = (song.discType || []).filter(function (t) { return t.indexOf(name + ' - ') === 0; });
      if (ownTypes.length) {
        ownTypes.forEach(function (t) {
          if (!groups[t]) { groups[t] = []; order.push(t); }
          groups[t].push(song);
        });
      } else {
        noType.push(song);
      }
    });

    order.sort(function (a, b) {
      const diff = discTypePriority(a) - discTypePriority(b);
      return diff !== 0 ? diff : a.localeCompare(b);
    });

    const metaBits = [];
    const discInfo = discByName[name];
    if (discInfo) {
      if (discInfo.releaseDate) metaBits.push(discInfo.releaseDate);
      if (discInfo.category) metaBits.push(discInfo.category);
    }

    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<div class="title-row"><h1>' + name + '</h1><div class="stream-links">' + shareButton(name) + '</div></div>' +
        (metaBits.length ? '<p class="desc">' + metaBits.join(' ・ ') + '</p>' : '') +
        '<p class="desc">' + songs.length + '曲収録</p>' +
      '</header>' +
      '<main id="disc-body"></main>';

    const body = document.getElementById('disc-body');
    if (!songs.length) {
      body.innerHTML = '<div class="empty">曲が見つかりません</div>';
      return;
    }

    const entryOpts = { hideDisc: true };
    let html = order.map(function (type) {
      return '<div class="role-group"><p class="role-title">' + type + '</p>' +
        groups[type].map(function (s) { return renderListEntry(s, entryOpts); }).join('') + '</div>';
    }).join('');

    if (noType.length) {
      html += '<div class="role-group"><p class="role-title">形態未設定</p>' +
        noType.map(function (s) { return renderListEntry(s, entryOpts); }).join('') + '</div>';
    }

    body.innerHTML = html;
  }

  // ---------- rendering: song detail ----------

  function detailRow(label, valueHtml) {
    if (!valueHtml) return '';
    return '<div class="detail-section"><p class="detail-label">' + label + '</p><div class="detail-value">' + valueHtml + '</div></div>';
  }

  function renderSongDetail(key) {
    const song = songById[key] || allSongs.find(function (s) { return s.title === key; });
    const page = document.getElementById('page');

    if (!song) {
      page.innerHTML = '<header>' + backLink() + '</header><div class="empty">曲が見つかりません</div>';
      return;
    }

    const discHtml = entityLinks(song.disc, 'disc');
    const metaLine = [song.release, discHtml ? '収録：' + discHtml : null].filter(Boolean).join(' ・ ');
    const tieupLine = tieupNames(song);

    const streamLinks = [];
    if (song.spotify) streamLinks.push('<a class="spotify" href="' + song.spotify + '" target="_blank" rel="noopener">▶︎ Spotify</a>');
    if (song.apple) streamLinks.push('<a class="apple" href="' + song.apple + '" target="_blank" rel="noopener">▶︎ Apple Music</a>');

    const ytList = renderYoutubeEmbeds(song.youtube);

    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<div class="title-row"><span class="title-group"><h1 style="margin:0">' + song.title + '</h1>' +
          (song.tag && song.tag.indexOf('ジュニア') !== -1 ? '<span class="junior-badge">ジュニア</span>' : '') +
          '</span><div class="stream-links">' + shareButton(song.title) + '</div></div>' +
        (metaLine ? '<p class="desc">' + metaLine + '</p>' : '') +
        (tieupLine ? '<p class="desc tieup">' + tieupLine + '</p>' : '') +
        (streamLinks.length ? '<div class="links">' + streamLinks.join('') + '</div>' : '') +
      '</header>' +
      '<main>' +
        detailRow(ROLE_LABELS.music, joinLinks(song.music, personLink)) +
        detailRow(ROLE_LABELS.lyrics, joinLinks(song.lyrics, personLink)) +
        detailRow(ROLE_LABELS.arrangement, joinLinks(song.arrangement, personLink)) +
        detailRow(ROLE_LABELS.other, joinLinks(song.other, personLink)) +
        detailRow(ROLE_LABELS.musicianChorus, joinLinks(song.musicianChorus, personLink)) +
        detailRow(ROLE_LABELS.mix, joinLinks(song.mix, personLink)) +
        detailRow(ROLE_LABELS.mastering, joinLinks(song.mastering, personLink)) +
        detailRow(ROLE_LABELS.movieDirector, joinLinks(song.movieDirector, personLink)) +
        detailRow(ROLE_LABELS.choreographer, joinLinks(song.choreographer, personLink)) +
        detailRow('Solo / Unit', soloUnitLine(song)) +
        detailRow('Tag', entityLinks(song.tag, 'tag')) +
        detailRow('Live', entityLinks(song.live, 'live')) +
        (ytList ? '<div class="detail-section"><p class="detail-label">YouTube (' + song.youtube.length + ')</p>' + ytList + '</div>' : '') +
      '</main>';
  }

  // ---------- rendering: person (staff credit) page ----------

  function renderPerson(name) {
    const roleKeys = Object.keys(ROLE_LABELS);
    const songs = allSongs.filter(function (song) {
      return roleKeys.some(function (role) {
        return song[role] && song[role].indexOf(name) !== -1;
      });
    });
    renderSimpleList(name, songs);
  }

  // ---------- rendering: member page ----------

  function renderMember(name) {
    const page = document.getElementById('page');
    const style = MEMBER_STYLE[name] || { bg: '#555', text: '#fff' };

    const soloSongs = allSongs.filter(function (s) { return s.solo && s.solo.indexOf(name) !== -1; });
    const unitSongs = allSongs.filter(function (s) { return s.unit && s.unit.indexOf(name) !== -1; });

    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<div class="member-header"><div class="member-title"><span class="member-dot" style="background:' + style.bg + '"></span><h1 style="margin:0">' + name + '</h1></div><div class="stream-links">' + shareButton(name) + '</div></div>' +
        '<p class="desc">Solo ' + soloSongs.length + '曲 ・ Unit ' + unitSongs.length + '曲</p>' +
      '</header>' +
      '<main>' +
        (soloSongs.length ? '<div class="role-group"><p class="role-title">Solo</p>' + soloSongs.map(renderListEntry).join('') + '</div>' : '') +

        (!soloSongs.length && !unitSongs.length ? '<div class="empty">曲が見つかりません</div>' : '') +
      '</main>';

  // ---------- rendering: notice page ----------

  const NOTICE_ITEMS = [

  function renderNotice() {
    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>⚠️ 注意</h1>' +
      '</header>' +
      '<main>' +
        '<div class="notice-box">' +
          '<ul class="notice-list">' + NOTICE_ITEMS.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '</div>' +
      '</main>';

  // ---------- rendering: index pages (Disc / Live / Member / credit roles) ----------

  function renderIndexPage(title, list, routePrefix, opts) {
    opts = opts || {};
    const sort = opts.sort || 'desc';
    const hashBase = opts.hashBase;
    const page = document.getElementById('page');

    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>' + title + '</h1>' +
        '<p class="desc">' + list.length + '件</p>' +
        (hashBase ? '<button class="sort-btn" id="index-sort-toggle">' + (sort === 'asc' ? '昇順' : '降順') + ' ▾</button>' : '') +
      '</header>' +
      '<main>' + (list.length
        ? '<ul class="index-list">' + list.map(function (item) {
            const metaText = [item.meta, (item.count != null ? item.count + '曲' : null)].filter(Boolean).join(' ・ ');
            return '<li><a href="#/' + routePrefix + '/' + enc(item.name) + '">' + item.name + '</a>' +
              (metaText ? '<span class="index-count">' + metaText + '</span>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<div class="empty">見つかりません</div>') +
      '</main>';

    if (hashBase) {
      document.getElementById('index-sort-toggle').addEventListener('click', function () {
        updateQuery(hashBase + '?sort=' + (sort === 'asc' ? 'desc' : 'asc'));
      });
    }
  }

  function buildPersonCounts(roleFields) {
    const counts = {};
    allSongs.forEach(function (song) {
      const names = new Set();
      roleFields.forEach(function (field) {
        (song[field] || []).forEach(function (n) { names.add(n); });
      });
      names.forEach(function (n) { counts[n] = (counts[n] || 0) + 1; });
    });
    return Object.keys(counts).map(function (name) { return { name: name, count: counts[name] }; });
  }

  function renderCreditIndex(title, roleFields, params, hashBase) {
    const sort = (params && params.get('sort')) || 'desc';
    const list = buildPersonCounts(roleFields).sort(function (a, b) {
      const diff = a.count - b.count;
      return sort === 'asc' ? diff : -diff;
    });
    renderIndexPage(title, list, 'person', { sort: sort, hashBase: hashBase });
  }

  function renderDiscsIndex(params) {
    const sort = (params && params.get('sort')) || 'desc';
    const info = {};
    allSongs.forEach(function (song) {
      (song.disc || []).forEach(function (name) {
        if (!info[name]) info[name] = { maxNo: 0 };
        info[name].maxNo = Math.max(info[name].maxNo, song.no || 0);
      });
    });
    const fullList = Object.keys(info)
      .map(function (name) {
        const d = discByName[name];
        return {
          name: name,
          maxNo: info[name].maxNo,
          category: d ? d.category : null,
          releaseDate: d ? d.releaseDate : null,
        };
      })
      .sort(function (a, b) {
        const diff = a.maxNo - b.maxNo;
        return sort === 'asc' ? diff : -diff;
      });

    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>Disc</h1>' +
        '<p class="desc">' + fullList.length + '件</p>' +
        '<div class="video-filter-row">' +
          '<label><input type="checkbox" id="filter-single"> シングル</label>' +
          '<label><input type="checkbox" id="filter-album"> アルバム</label>' +
        '</div>' +
        '<button class="sort-btn" id="disc-sort-toggle" style="margin-top:12px;">' + (sort === 'asc' ? '昇順' : '降順') + ' ▾</button>' +
      '</header>' +
      '<main id="disc-index-body"></main>';

    function draw(list) {
      const body = document.getElementById('disc-index-body');
      if (!list.length) { body.innerHTML = '<div class="empty">見つかりません</div>'; return; }
      body.innerHTML = '<ul class="index-list">' + list.map(function (item) {
        const metaText = [item.releaseDate, item.category].filter(Boolean).join(' ・ ');
        return '<li><a href="#/disc/' + enc(item.name) + '">' + item.name + '</a>' +
          (metaText ? '<span class="index-count">' + metaText + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
    }

    function applyFilter() {
      const wantSingle = document.getElementById('filter-single').checked;
      const wantAlbum = document.getElementById('filter-album').checked;
      if (!wantSingle && !wantAlbum) { draw(fullList); return; }
      draw(fullList.filter(function (item) {
        if (wantSingle && item.category === 'Single') return true;
        if (wantAlbum && (item.category === 'Album' || item.category === 'Best Album')) return true;
        return false;
      }));
    }

    draw(fullList);
    document.getElementById('filter-single').addEventListener('change', applyFilter);
    document.getElementById('filter-album').addEventListener('change', applyFilter);
    document.getElementById('disc-sort-toggle').addEventListener('click', function () {
      updateQuery('/discs?sort=' + (sort === 'asc' ? 'desc' : 'asc'));
    });
  }

  const LIVE_TABS = [
    { id: 'solo', label: '単独公演', categories: ['スタジアム', 'ドーム', 'アリーナ', 'ホール'] },
    { id: 'other', label: '外部出演' }
  ];

  function renderLivesIndex(params) {
    const sort = params.get('sort') || 'desc';
    const tab = params.get('tab') || 'solo';
    const soloCategories = LIVE_TABS[0].categories;

    const filtered = allLives.filter(function (l) {
      if (!l.category) return false;
      const isSolo = soloCategories.indexOf(l.category) !== -1;
      return tab === 'solo' ? isSolo : !isSolo;
    });
    const sorted = filtered.slice().sort(function (a, b) {
      const diff = (a.periodStart || '').localeCompare(b.periodStart || '');
      return sort === 'asc' ? diff : -diff;
    });

    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>Live</h1>' +
        '<div class="tabs">' + LIVE_TABS.map(function (t) {
          return '<button class="tab-btn' + (t.id === tab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
        }).join('') + '</div>' +
        '<button class="sort-btn" id="lives-sort-toggle" style="margin-top:14px;">' + (sort === 'asc' ? '古い順' : '新しい順') + ' ▾</button>' +
      '</header>' +
      '<main>' + (sorted.length
        ? '<ul class="index-list">' + sorted.map(function (l) {
            const meta = [formatPeriod(l), tab === 'solo' ? l.category : null].filter(Boolean).join(' ・ ');
            return '<li><a href="#/live/' + enc(l.name) + '">' + l.name + '</a>' +
              (meta ? '<span class="index-count">' + meta + '</span>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<div class="empty">' + (allLives.length ? '見つかりません' : 'まだlives.jsonが読み込まれていません') + '</div>') +
      '</main>';

    page.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        updateQuery('/lives?tab=' + btn.getAttribute('data-tab') + '&sort=' + sort);
      });
    });
    document.getElementById('lives-sort-toggle').addEventListener('click', function () {
      updateQuery('/lives?tab=' + tab + '&sort=' + (sort === 'asc' ? 'desc' : 'asc'));
    });
  }

  function renderMembersIndex() {
    const order = MEMBER_ORDER;
    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>Unit / Solo</h1>' +
      '</header>' +
      '<main><div class="badge-row" style="font-size:16px; line-height:2.6;">' +
        order.map(memberBadge).join(' ') +
      '</div></main>';
  }

  function renderYoutubeCategory(catId, params) {
    const cat = YOUTUBE_CATEGORIES.find(function (c) { return c.id === catId; }) || YOUTUBE_CATEGORIES[0];
    const sort = (params && params.get('sort')) || 'desc';

    const videos = allYoutube
      .filter(function (y) { return y.tag && y.tag.indexOf(cat.tag) !== -1; })
      .sort(function (a, b) {
        const av = a.publishedAt || a.createdTime || '';
        const bv = b.publishedAt || b.createdTime || '';
        const diff = av.localeCompare(bv);
        return sort === 'asc' ? diff : -diff;
      });

    const page = document.getElementById('page');
    page.innerHTML = '' +
      '<header>' +
        backLink() +
        '<h1>YouTube: ' + cat.label + '</h1>' +
        '<p class="desc">' + videos.length + '本</p>' +
        '<div class="tabs">' + YOUTUBE_CATEGORIES.map(function (c) {
          return '<a class="tab-btn' + (c.id === cat.id ? ' active' : '') + '" href="#/youtube/' + c.id + '">' + c.label + '</a>';
        }).join('') + '</div>' +
        '<button class="sort-btn" id="yt-sort-toggle" style="margin-top:12px;">' + (sort === 'asc' ? '投稿が古い順' : '投稿が新しい順') + ' ▾</button>' +
      '</header>' +
      '<main>' + (videos.length
        ? '<div class="yt-grid">' + videos.map(function (y) {
            const vid = extractYoutubeId(y.url);
            const thumb = y.thumbnail || (vid ? 'https://img.youtube.com/vi/' + vid + '/hqdefault.jpg' : '');
            return '<a class="yt-grid-item" href="' + y.url + '" target="_blank" rel="noopener">' +
              (thumb ? '<img src="' + thumb + '" alt="" loading="lazy">' : '<div class="yt-grid-noimg">▶︎</div>') +
              '<span>' + (y.title || 'YouTube') + '</span>' +
            '</a>';
          }).join('') + '</div>'
        : '<div class="empty">見つかりません</div>') +
      '</main>';

    document.getElementById('yt-sort-toggle').addEventListener('click', function () {
      updateQuery('/youtube/' + cat.id + '?sort=' + (sort === 'asc' ? 'desc' : 'asc'));
    });
  }

  // ---------- router ----------

  function parseHash() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const parts2 = raw.split('?');
    return { path: parts2[0], params: new URLSearchParams(parts2[1] || '') };
  }

  function route() {
    const parsed = parseHash();
    const parts = parsed.path.split('/').filter(Boolean);

    if (parts[0] === 'song' && parts[1]) { renderSongDetail(dec(parts[1])); return; }
    if (parts[0] === 'person' && parts[1]) { renderPerson(dec(parts[1])); return; }
    if (parts[0] === 'member' && parts[1]) { renderMember(dec(parts[1])); return; }
    if (parts[0] === 'disc' && parts[1]) { renderDisc(dec(parts[1])); return; }
    if (parts[0] === 'tag' && parts[1]) { renderTag(dec(parts[1])); return; }
    if (parts[0] === 'live' && parts[1]) { renderLive(dec(parts[1])); return; }
    if (parts[0] === 'notice') { renderNotice(); return; }
    if (parts[0] === 'discs') { renderDiscsIndex(parsed.params); return; }
    if (parts[0] === 'lives') { renderLivesIndex(parsed.params); return; }
    if (parts[0] === 'members') { renderMembersIndex(); return; }
    if (parts[0] === 'youtube' && parts[1]) { renderYoutubeCategory(parts[1], parsed.params); return; }
    if (parts[0] === 'credits' && parts[1] && CREDIT_GROUPS[parts[1]]) {
      const g = CREDIT_GROUPS[parts[1]];
      renderCreditIndex(g.title, g.roles, parsed.params, '/credits/' + parts[1]);
      return;
    }
    renderList(parsed.params);
  }

  fetch('songs.json')
    .then(function (res) { return res.json(); })
    .then(function (songs) {
      allSongs = songs;
      songById = {};
      songs.forEach(function (s) { songById[songKeyOf(s)] = s; });

      return fetch('lives.json').then(function (res) { return res.json(); }).catch(function () { return []; });
    })
    .then(function (lives) {
      allLives = lives;
      liveByName = {};
      lives.forEach(function (l) { liveByName[l.name] = l; });

      return fetch('discs.json').then(function (res) { return res.json(); }).catch(function () { return []; });
    })
    .then(function (discs) {
      discByName = {};
      discs.forEach(function (d) { discByName[d.name] = d; });

      return fetch('youtube.json').then(function (res) { return res.json(); }).catch(function () { return []; });
    })
    .then(function (youtube) {
      allYoutube = youtube;

      window.addEventListener('hashchange', route);
      route();
    })
    .catch(function (err) {
      document.getElementById('page').innerHTML = '<div class="empty">読み込みに失敗しました<span class="mono">' + err + '</span></div>';
    });
</script>

</body>
</html>
